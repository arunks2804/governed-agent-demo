[pytest]
asyncio_mode = auto
asyncio_default_fixture_loop_scope = function
markers =
    chaos_opa_down: run only while OPA is stopped (scripts/test.sh handles this)
    chaos_db_down: run only while PostgreSQL is stopped (scripts/test.sh handles this)
    prompt_only: requires the prompt-only comparison overlay (compose.prompt-only.yaml)
    live_llm: calls a real LLM; never required for the suite to pass
filterwarnings =
    ignore::DeprecationWarning
